name: moony-mcbot CI

on:
  push:
    paths:
      - "moony-mcbot/**"
      - ".github/workflows/moony-mcbot-ci.yml"
  pull_request:
    paths:
      - "moony-mcbot/**"
      - ".github/workflows/moony-mcbot-ci.yml"

permissions:
  contents: read

concurrency:
  group: moony-mcbot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }} - release validation, lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    defaults:
      run:
        working-directory: moony-mcbot

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: moony-mcbot/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate release entries
        run: npm run validate:releases

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
